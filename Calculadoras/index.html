<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadoras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app">

    <header class="app-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="url(#logoGrad)"/>
          <path d="M8 20l4-8 4 8M10 17h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
              <stop stop-color="#a78bfa"/>
              <stop offset="1" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Calculadoras</span>
      </div>
      <div class="header-badge">
        <span class="dot"></span>
        Activo
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="promedio">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M2 13l3-3 2.5 2.5L12 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Promedio semestre
      </button>
      <button class="tab" data-tab="nota">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M7 2v11M3 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ¿Qué nota necesito?
      </button>
    </div>

    <!-- Tab: Promedio semestre -->
    <div class="tab-content active" id="tab-promedio">

      <section class="hero-section">
        <div class="hero-label">Promedio ponderado</div>
        <div class="hero-display" id="promedio-display">—</div>
        <div class="hero-sub" id="promedio-sub"></div>
      </section>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon purple">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 15l4-4 3 3 5-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Rendimiento</div>
            <div class="stat-val" id="rendimiento-display">—</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="3" y="3" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M6 9h6M9 6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Materias</div>
            <div class="stat-val" id="cant-display">1</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.8"/>
              <path d="M9 6v3l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Total créditos</div>
            <div class="stat-val" id="creditos-display">0</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Materias del semestre
          <button class="add-btn" id="btn-agregar">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            Agregar materia
          </button>
        </div>
        <div class="materias-list" id="materias-list"></div>
      </div>

      <button class="btn btn-primary" id="btn-calcular-promedio">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M5 3l7 4.5L5 12V3z" fill="currentColor"/>
        </svg>
        Calcular promedio
      </button>

      <div class="panel" id="log-panel" style="display:none;">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Detalle por materia
        </div>
        <div class="log-list" id="log-list"></div>
      </div>

    </div>

    <!-- Tab: Nota para pasar -->
    <div class="tab-content" id="tab-nota">

      <section class="hero-section">
        <div class="hero-label">Nota que necesitas en el tercer corte</div>
        <div class="hero-display" id="nota-display">—</div>
        <div class="hero-sub" id="nota-sub"></div>
      </section>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon purple">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 9h12M9 3v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Corte 1 (30%)</div>
            <div class="stat-val" id="stat-corte1">—</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 9h12M9 3v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Corte 2 (30%)</div>
            <div class="stat-val" id="stat-corte2">—</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 15l4-4 3 3 5-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div class="stat-label">Nota deseada</div>
            <div class="stat-val" id="stat-deseada">—</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 8h12M8 2v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Ingresa tus notas
        </div>
        <div class="inputs-grid">
          <div class="input-group">
            <label>Primer corte <span class="peso">30%</span></label>
            <div class="input-wrap">
              <input type="number" id="corte1" placeholder="0.0 — 5.0" min="0" max="5" step="0.1" />
            </div>
          </div>
          <div class="input-group">
            <label>Segundo corte <span class="peso">30%</span></label>
            <div class="input-wrap">
              <input type="number" id="corte2" placeholder="0.0 — 5.0" min="0" max="5" step="0.1" />
            </div>
          </div>
          <div class="input-group full">
            <label>Nota que deseas obtener <span class="peso">en el semestre</span></label>
            <div class="input-wrap">
              <input type="number" id="deseada" placeholder="ej: 3.0" min="0" max="5" step="0.1" />
            </div>
          </div>
        </div>
        <button class="btn btn-primary" id="btn-calcular-nota">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M5 3l7 4.5L5 12V3z" fill="currentColor"/>
          </svg>
          Calcular nota necesaria
        </button>
      </div>

      <div class="panel" id="resultado-panel" style="display:none;">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Desglose del cálculo
        </div>
        <div class="desglose" id="desglose"></div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
